# P25.5-E10: Service ו־ConfigMap
apiVersion: v1
kind: ConfigMap
metadata:
  name: coffee-config
data:
  LOG_LEVEL: info
  PORT: "3000"
  CORS_ORIGINS: https://shop.coffee.example
  TRUST_PROXY: "1"
---
apiVersion: v1
kind: Service
metadata:
  name: coffee-api
spec:
  type: ClusterIP
  selector:
    app: coffee-api
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: coffee-api
spec:
  replicas: 3
  selector:
    matchLabels:
      app: coffee-api
  template:
    metadata:
      labels:
        app: coffee-api
    spec:
      containers:
        - name: api
          image: ghcr.io/noa-cohen/coffee-shop:1.4.2
          ports:
            - name: http
              containerPort: 3000
          envFrom:
            - configMapRef:
                name: coffee-config
