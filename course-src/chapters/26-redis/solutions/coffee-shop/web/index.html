<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- בפריסה: הכתובת של ה־API. מקומית (localhost) — http://localhost:3000 -->
  <meta name="api-url" content="https://YOUR-SERVICE.onrender.com">
  <title>☕ ציוד קפה</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>☕ ציוד קפה</h1>
    <div id="account"></div>
  </header>
  <p id="message" role="status"></p>

  <section id="login-box" class="card">
    <h2>כניסה</h2>
    <form id="login">
      <input name="email" type="email" placeholder="אימייל" required>
      <input name="password" type="password" placeholder="סיסמה" required>
      <input name="name" placeholder="שם (להרשמה)">
      <button>כניסה</button>
      <button type="button" id="register" class="secondary">הרשמה</button>
    </form>
  </section>

  <main>
    <section>
      <form id="search" class="row">
        <input name="q" placeholder="חיפוש…">
        <select name="sort">
          <option value="newest">חדשים</option>
          <option value="price">מחיר: מהזול</option>
          <option value="-price">מחיר: מהיקר</option>
        </select>
        <label><input type="checkbox" name="inStock" value="true"> רק במלאי</label>
        <button>חיפוש</button>
      </form>
      <ul id="products" class="grid"></ul>
    </section>

    <aside>
      <section class="card">
        <h2>🛒 עגלה</h2>
        <ul id="cart"></ul>
        <p>סה״כ: <strong id="cart-total">₪0.00</strong></p>
        <button id="checkout">להזמנה</button>
      </section>
      <section class="card">
        <h2>📦 ההזמנות שלי</h2>
        <ul id="orders"></ul>
      </section>
    </aside>
  </main>
  <script type="module" src="app.js"></script>
</body>
</html>
