# P26.3-E20: ה־Deployment אחרי התיקון
apiVersion: apps/v1
kind: Deployment
metadata:
  name: coffee-api
spec:
  replicas: 3
  selector:
    matchLabels:
      app: coffee-api # תיקון 1: זהה ל־labels של ה־template
  template:
    metadata:
      labels:
        app: coffee-api
    spec:
      containers:
        - name: api
          image: ghcr.io/noa-cohen/coffee-shop:1.4.2 # תיקון 4: גרסה קבועה, לא latest
          ports:
            - name: http
              containerPort: 3000
          readinessProbe:
            httpGet:
              path: /ready
              port: http # תיקון 2: הפורט שהאפליקציה מאזינה לו
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
          resources:
            requests:
              cpu: 500m
              memory: 256Mi
            limits:
              cpu: "1" # תיקון 3: limit לא קטן מה־request
              memory: 512Mi
