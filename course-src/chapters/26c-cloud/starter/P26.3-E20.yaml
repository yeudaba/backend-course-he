# P26.3-E20: ה־Deployment הזה לא עולה — ארבעה באגים
apiVersion: apps/v1
kind: Deployment
metadata:
  name: coffee-api
spec:
  replicas: 3
  selector:
    matchLabels:
      app: coffee
  template:
    metadata:
      labels:
        app: coffee-api
    spec:
      containers:
        - name: api
          image: ghcr.io/noa-cohen/coffee-shop:latest
          ports:
            - name: http
              containerPort: 3000
          readinessProbe:
            httpGet:
              path: /ready
              port: 8080
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
          resources:
            requests:
              cpu: 500m
              memory: 256Mi
            limits:
              cpu: 250m
              memory: 512Mi
