<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- בפריסה (פרק 25): הכתובת של ה־API ב־Render. מקומית מתעלמים ממנה ומשתמשים ב־localhost:3000 -->
  <meta name="api-url" content="https://YOUR-SERVICE.onrender.com">
  <title>המשימות שלי</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>המשימות שלי</h1>
    <p class="muted">דף הדגמה ל־tasks-api</p>
    <p id="whoami" class="muted" hidden><span id="whoami-email"></span> · <button id="logout" class="secondary" type="button">יציאה</button></p>
  </header>

  <main>
    <section class="card" id="auth">
      <h2>כניסה</h2>
      <form id="login-form">
        <label for="email">אימייל</label>
        <input id="email" name="email" type="email" required autocomplete="username" placeholder="dana@example.com">
        <label for="password">סיסמה</label>
        <input id="password" name="password" type="password" required minlength="8" autocomplete="current-password">
        <div class="row">
          <button type="submit">כניסה</button>
          <button type="button" id="register" class="secondary">הרשמה</button>
        </div>
      </form>
      <p id="auth-error" class="error" hidden></p>
    </section>

    <section class="card app" hidden>
      <h2>משימה חדשה</h2>
      <form id="new-task">
        <label for="title">כותרת</label>
        <input id="title" name="title" required maxlength="120" placeholder="למשל: ללמוד CORS">

        <div class="row">
          <div>
            <label for="priority">עדיפות</label>
            <select id="priority" name="priority">
              <option value="low">נמוכה</option>
              <option value="medium" selected>בינונית</option>
              <option value="high">גבוהה</option>
            </select>
          </div>
          <div>
            <label for="dueDate">תאריך יעד</label>
            <input id="dueDate" name="dueDate" type="date">
          </div>
        </div>

        <button type="submit">הוספה</button>
      </form>
    </section>

    <section class="card app" hidden>
      <div class="row between">
        <h2>רשימה</h2>
        <label>
          סטטוס:
          <select id="status-filter">
            <option value="">הכול</option>
            <option value="todo">לביצוע</option>
            <option value="in_progress">בתהליך</option>
            <option value="done">בוצעו</option>
          </select>
        </label>
      </div>
      <p id="error" class="error" hidden></p>
      <p id="loading" class="muted" hidden>טוען...</p>
      <ul id="tasks"></ul>
      <p id="empty" class="muted" hidden>אין משימות.</p>
    </section>
  </main>

  <script type="module" src="app.js"></script>
</body>
</html>
