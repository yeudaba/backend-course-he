name: ci
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci
        ports: ["3306:3306"]
        options: >-
          --health-cmd "mysqladmin ping -pci" --health-interval 5s --health-retries 20
      kafka:
        image: apache/kafka:4.1.0
        ports: ["9092:9092"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
        env:
          MYSQL_URL: mysql://root:ci@localhost:3306
          KAFKA_BROKERS: localhost:9092
      - run: docker build -t events-platform:${{ github.sha }} .
