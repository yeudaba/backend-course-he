<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 400" width="1280" height="400" role="img" aria-label="קורס Backend בעברית — מאפס ועד משרת Junior">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1023"/>
      <stop offset="0.55" stop-color="#1b2559"/>
      <stop offset="1" stop-color="#3b1c6e"/>
    </linearGradient>
    <linearGradient id="title" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#c4b5fd"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#a78bfa" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.045"/>
    </pattern>
  </defs>
  <rect width="1280" height="400" rx="24" fill="url(#bg)"/>
  <rect width="1280" height="400" rx="24" fill="url(#grid)"/>
  <circle cx="1130" cy="70" r="180" fill="#7c3aed" opacity="0.18"/>
  <circle cx="120" cy="360" r="160" fill="#06b6d4" opacity="0.12"/>

  <!-- כותרת -->
  <g font-family="'Segoe UI', 'Helvetica Neue', Arial, 'Noto Sans Hebrew', sans-serif" text-anchor="start" direction="rtl">
    <text x="1200" y="128" font-size="66" font-weight="800" fill="url(#title)">קורס Backend בעברית</text>
    <text x="1200" y="182" font-size="30" font-weight="500" fill="#cbd5e1">מאפס ועד משרת Junior — עם פרויקטים לתיק העבודות</text>
  </g>

  <!-- צינור הבקשה -->
  <g font-family="'SF Mono', Menlo, Consolas, monospace" font-size="17" font-weight="600" text-anchor="middle">
    <g>
      <rect x="80" y="236" width="150" height="48" rx="12" fill="#0f172a" stroke="#22d3ee" stroke-width="2"/>
      <text x="155" y="266" fill="#a5f3fc">HTTP</text>
    </g>
    <g>
      <rect x="270" y="236" width="150" height="48" rx="12" fill="#0f172a" stroke="#34d399" stroke-width="2"/>
      <text x="345" y="266" fill="#a7f3d0">Guard · JWT</text>
    </g>
    <g>
      <rect x="460" y="236" width="150" height="48" rx="12" fill="#0f172a" stroke="#a78bfa" stroke-width="2"/>
      <text x="535" y="266" fill="#ddd6fe">Controller</text>
    </g>
    <g>
      <rect x="650" y="236" width="150" height="48" rx="12" fill="#0f172a" stroke="#f472b6" stroke-width="2"/>
      <text x="725" y="266" fill="#fbcfe8">Service</text>
    </g>
    <g>
      <rect x="840" y="236" width="150" height="48" rx="12" fill="#0f172a" stroke="#fbbf24" stroke-width="2"/>
      <text x="915" y="266" fill="#fde68a">Prisma</text>
    </g>
    <g>
      <rect x="1030" y="236" width="170" height="48" rx="12" fill="#0f172a" stroke="#60a5fa" stroke-width="2"/>
      <text x="1115" y="266" fill="#bfdbfe">PostgreSQL</text>
    </g>
  </g>
  <g stroke="#94a3b8" stroke-width="2" fill="none" stroke-linecap="round">
    <path d="M232 260H266"/><path d="M422 260H456"/><path d="M612 260H646"/><path d="M802 260H836"/><path d="M992 260H1026"/>
  </g>
  <g fill="#94a3b8">
    <path d="M266 260l-8-5v10z"/><path d="M456 260l-8-5v10z"/><path d="M646 260l-8-5v10z"/><path d="M836 260l-8-5v10z"/><path d="M1026 260l-8-5v10z"/>
  </g>

  <rect x="80" y="318" width="1120" height="2" fill="url(#line)"/>
  <g font-family="'SF Mono', Menlo, Consolas, monospace" font-size="16" fill="#94a3b8" text-anchor="middle">
    <text x="640" y="356">JavaScript · TypeScript · Node.js · Express · SQL · Prisma · NestJS · Auth · Docker · CI/CD</text>
  </g>
