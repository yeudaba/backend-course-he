# P26.3-E66: CronJob לדוח הלילי
apiVersion: batch/v1
kind: CronJob
metadata:
  name: nightly-report
spec:
  schedule: "0 2 * * *"
  timeZone: Asia/Jerusalem
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 1800
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: report
              image: ghcr.io/noa-cohen/coffee-shop:1.4.2
              command: ["node", "dist/reports/nightly.js"]
              envFrom:
                - secretRef:
                    name: coffee-secrets
