# P25.5-E15: Argo CD Application — Argo CD מושך את ה־chart מ־repo התצורה ושומר את ה־cluster מסונכרן
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: coffee-api-prod
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/noa-cohen/coffee-deploy.git
    targetRevision: main
    path: charts/coffee-api
    helm:
      valueFiles:
        - values-prod.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: coffee
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
