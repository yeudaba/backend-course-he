# P25-E102: לא רץ על PR, נכשל בצעד השני, ומתקין גרסאות אחרות. שלוש תקלות.
# בדיקה:  npm run check P25-E102
name: CI
on:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - uses: actions/checkout@v5
      - run: npm install
      - run: npm test
