<form action="/products" method="get">
  <label for="q">חיפוש</label>
  <input id="q" name="q" type="search">

  <label for="sort">מיון</label>
  <select id="sort" name="sort">
    <option value="price">מחיר: מהזול ליקר</option>
    <option value="-price">מחיר: מהיקר לזול</option>
    <option value="name" selected>שם</option>
  </select>

  <label for="maxPrice">מחיר מקסימלי</label>
  <input id="maxPrice" name="maxPrice" type="number" min="0">

  <button type="submit">חיפוש</button>
</form>
