<!doctype html>
<html lang="he" dir="rtl">
<head><meta charset="utf-8"><title>מונה ביקורים</title></head>
<body>
  <h1>מונה ביקורים</h1>
  <p>ביקורים: <span id="count">…</span></p>
  <script>
    // אותו מקור (origin) — nginx מעביר את /api ל־app. בלי CORS בכלל
    fetch("/api/visits").then((r) => r.json()).then((d) => (document.getElementById("count").textContent = d.visits));
  </script>
</body>
</html>
