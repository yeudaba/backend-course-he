# P23-E21: שלוש תקלות — ה־app לא מצליח להתחבר, לפעמים עולה לפני המסד, ו־PostgreSQL 18 לא עולה בכלל
services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: visits
    volumes:
      - db-data:/var/lib/postgresql/data

  app:
    build: .
    environment:
      DATABASE_URL: postgresql://app:app@localhost:5432/visits
    ports:
      - "${APP_PORT:-3000}:3000"
    depends_on:
      - db

volumes:
  db-data:
