services:
  test-db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_DB: test
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test -d test"]
      interval: 2s
      timeout: 3s
      retries: 30
  tests:
    build:
      context: .
      target: build
    command: ["npm", "run", "test:int"]
    environment:
      DATABASE_URL_TEST: postgresql://test:test@test-db:5432/test
    depends_on:
      test-db:
        condition: service_healthy
