# P26-E103: compose.yaml — Redis עם healthcheck
services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: shop
      POSTGRES_PASSWORD: shop
      POSTGRES_DB: shop
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shop -d shop"]
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:8-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  api:
    build: .
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://shop:shop@db:5432/shop
      REDIS_URL: redis://redis:6379
      REDIS_PREFIX: shop
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
