<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>המשימות שלי</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>המשימות שלי</h1>
    <p class="muted">דף הדגמה ל־tasks-api</p>
  </header>

  <main>
    <section class="card">
      <h2>משימה חדשה</h2>
      <form id="new-task">
        <label for="title">כותרת</label>
        <input id="title" name="title" required maxlength="120" placeholder="למשל: ללמוד CORS">

        <div class="row">
          <div>
            <label for="priority">עדיפות</label>
            <select id="priority" name="priority">
              <option value="low">נמוכה</option>
              <option value="medium" selected>בינונית</option>
              <option value="high">גבוהה</option>
            </select>
          </div>
          <div>
            <label for="dueDate">תאריך יעד</label>
            <input id="dueDate" name="dueDate" type="date">
          </div>
        </div>

        <button type="submit">הוספה</button>
      </form>
    </section>

    <section class="card">
      <div class="row between">
        <h2>רשימה</h2>
        <label>
          סטטוס:
          <select id="status-filter">
            <option value="">הכול</option>
            <option value="todo">לביצוע</option>
            <option value="in_progress">בתהליך</option>
            <option value="done">בוצעו</option>
          </select>
        </label>
      </div>
      <p id="error" class="error" hidden></p>
      <p id="loading" class="muted" hidden>טוען...</p>
      <ul id="tasks"></ul>
      <p id="empty" class="muted" hidden>אין משימות.</p>
    </section>
  </main>

  <script type="module" src="app.js"></script>
</body>
</html>
